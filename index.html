<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getiri Takibi Sistemi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">

  <style>
    :root { --bg-main: #0a0e14; --bg-panel: #111820; --text-main: #E2E8F0; --gold: #FACC15; --blue-accent: #38BDF8; --green-accent: #10B981; --red-accent: #EF4444; --red-btn: #991B1B; --border-color: #2D3748; --panel-border: #1F2937; }
    body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
    .main-content { flex: 1; display: flex; flex-direction: column; padding: 5px 15px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; overflow: hidden;}
    
    .top-header { position: relative; display: flex; justify-content: flex-end; align-items: center; background-color: var(--red-btn); padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #FCA5A5;}
    .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 1.25rem; font-weight: 900; margin: 0; letter-spacing: 1px; color: white; white-space: nowrap; z-index: 1;}
    .update-badge { background-color: #000; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; border: 1px solid #333; display: flex; align-items: center; gap: 6px; z-index: 2;}
    .update-badge .dot { width: 6px; height: 6px; background-color: #22C55E; border-radius: 50%; box-shadow: 0 0 6px #22C55E; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    
    .tab-buttons { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { flex: 1; padding: 6px 8px; border-radius: 8px; font-size: 0.9rem; font-weight: 900; cursor: pointer; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; gap: 6px; transition: 0.2s; color: white; font-family: 'Inter', sans-serif; }
    .tab-btn.active { background-color: var(--red-btn); border-color: #F87171; }
    .tab-btn.inactive { background-color: var(--bg-panel); }
    .tab-btn.inactive:hover { background-color: #1E293B; }

    /* SMART TV OPTİMİZASYONLARI: odaklanan her alan net görünmeli */
    button:focus, select:focus, input:focus { outline: 3px solid var(--gold) !important; outline-offset: 2px !important; }

    .date-controls { background: #111820; padding: 8px 25px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 10px; display: none; justify-content: center; align-items: center; gap: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
    .date-group { display: flex; align-items: center; gap: 8px; }
    .date-controls label { color: var(--gold); font-weight: 900; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; margin: 0; }
    .date-input { background-color: #0a0e14 !important; border: 1px solid var(--border-color) !important; color: white !important; padding: 6px 15px !important; border-radius: 6px !important; font-family: 'Inter', sans-serif !important; font-weight: 800 !important; font-size: 1.0rem !important; outline: none !important; cursor: pointer !important; transition: all 0.3s ease !important; text-align: center; width: 140px; box-sizing: border-box;}
    .date-input:focus, .date-input:hover { border-color: var(--gold) !important; box-shadow: 0 0 8px rgba(250, 204, 21, 0.2) !important; }
    
    /* FLATPICKR DARK MODE FIX */
    .flatpickr-calendar { background: #111820 !important; border: 1px solid #2D3748 !important; box-shadow: 0 10px 25px rgba(0,0,0,0.8) !important; font-family: 'Inter', sans-serif !important; }
    .flatpickr-day { color: #E2E8F0 !important; }
    .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay { color: #475569 !important; }
    .flatpickr-day.selected { background: var(--gold) !important; color: #000 !important; border-color: var(--gold) !important; font-weight: 900 !important; }
    .flatpickr-day:hover { background: #1F2937 !important; color: #ffffff !important; }
    .flatpickr-current-month .flatpickr-monthDropdown-months, .flatpickr-current-month input.cur-year { color: #E2E8F0 !important; }
    span.flatpickr-weekday { color: #38BDF8 !important; }
    .flatpickr-month, .flatpickr-prev-month svg, .flatpickr-next-month svg { color: #E2E8F0 !important; fill: #E2E8F0 !important; }
    
    .table-container { background-color: var(--bg-panel); border-radius: 10px; border: 1px solid var(--panel-border); box-shadow: 0 10px 20px rgba(0,0,0,0.5); flex: 1; display: block; width: 100%; overflow-x: auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    
    table { border-collapse: collapse; text-align: center; margin: 0 auto; width: max-content;}
    thead { border-bottom: 2px solid var(--panel-border); background-color: #141b24; }
    th, td { box-sizing: border-box; vertical-align: middle; }
    th { color: var(--gold); font-weight: 900; letter-spacing: 0.5px; }
    td { border-bottom: 1px solid rgba(255,255,255,0.03); font-weight: 700; }
    
    .mode-yillar { width: max-content; margin: 0 auto; }
    .mode-yillar th { font-size: 1.05rem; padding: 6px 10px; white-space: nowrap; min-width: 100px; }
    .mode-yillar td { padding: 4px 10px; height: auto; white-space: nowrap; min-width: 100px; }
    .mode-tarih { width: 100%; max-width: 420px; margin: 0 auto; table-layout: fixed; }
    
    .mode-tarih th, .mode-tarih td { overflow: hidden; text-overflow: ellipsis; }
    .mode-tarih th:nth-child(1), .mode-tarih td:nth-child(1) { width: 15%; text-align: center !important; }
    .mode-tarih th:nth-child(2), .mode-tarih td:nth-child(2) { width: 40%; text-align: left !important; padding: 4px 5px !important; padding-left: 20px !important; }
    .mode-tarih th:nth-child(3), .mode-tarih td:nth-child(3) { width: 45%; text-align: center !important; padding: 4px 5px !important; }
    .mode-tarih th { font-size: 1.15rem; padding: 4px 5px !important; }
    .mode-tarih td { font-size: 1.0rem; padding: 1px 5px !important; white-space: nowrap; }
    
    .select-wrapper { display: inline-flex; align-items: center; justify-content: flex-start !important; gap: 6px; width: 100%; margin: 0; }
    
    /* Native SELECT (Smart TV uyumlu, hücre içi) */
    .asset-select { background-color: #0a0e14; border: 1px solid var(--border-color); color: var(--blue-accent); font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1.05rem; padding: 6px; border-radius: 6px; cursor: pointer; outline: none; width: 100%; }
    .asset-select:hover { background-color: #1a222d; }
    .asset-select option, .asset-select optgroup { background-color: var(--bg-panel); color: white; }
    
    .sabit-varlik { font-size: 1.05rem !important; }
    .getiri-wrapper { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; width: 100%; }
    .mode-tarih .getiri-wrapper { position: relative; align-items: center !important; }
    .kat-val { font-size: 0.70rem; color: var(--gold); font-weight: 900; margin-top: 1px; letter-spacing: 0px; }
    .getiri-val { font-weight: 900; }
    .mode-tarih .arz-val { position: absolute; left: 100%; margin-left: 8px; font-size: 0.75em; color: #FBBF24; font-weight: 700; white-space: nowrap; }
    
    .col-sira { color: var(--gold); text-align: center; font-size: 1.05rem !important; font-weight: 900; }
    .col-varlik { text-align: left !important; padding-left: 20px !important; white-space: nowrap; overflow: hidden; }
    .col-getiri { color: var(--green-accent); font-weight: 800;}
    .col-getiri.negative { color: var(--red-accent); }
    
    .mode-yillar th:nth-child(1), .mode-yillar td:nth-child(1) { position: sticky; left: 0; z-index: 2; background-color: var(--bg-panel); width: 50px; min-width: 50px; }
    .mode-yillar th:nth-child(2), .mode-yillar td:nth-child(2) { position: sticky; left: 50px; z-index: 2; background-color: var(--bg-panel); box-shadow: 2px 0 8px rgba(0,0,0,0.3); width: 120px; min-width: 120px; }
    .mode-yillar th:nth-child(1), .mode-yillar th:nth-child(2) { background-color: #141b24; }
    tbody tr:hover td { background-color: rgba(255, 255, 255, 0.05); }
    .mode-yillar tbody tr:hover td:nth-child(1), .mode-yillar tbody tr:hover td:nth-child(2) { background-color: #1a222d; }
    
    .loading-state { text-align: center; padding: 30px; color: #94A3B8; font-size: 1rem; font-weight: 600; }
    .loading-state i { color: #10B981; margin-bottom: 10px; font-size: 2rem; }
    .row-loading { opacity: 0.4; pointer-events: none; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #111820; border-left: 4px solid #10B981; color: white; padding: 15px 20px; border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 12px; font-weight: 700; opacity: 0; transform: translateY(20px); transition: all 0.4s ease; z-index: 9999; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ===== AYLIK GETİRİ SEKMESİ ===== */
    body.aylik-modu { display: block; height: auto; min-height: 100vh; overflow-y: auto; overflow-x: hidden; }
    body.aylik-modu .main-content { display: block; height: auto; overflow: visible; }
    body.aylik-modu #aylikContainer { overflow: visible; flex: none; }

    body.aylik-modu .top-header { padding: 4px 12px; margin-bottom: 6px; }
    body.aylik-modu .header-title { font-size: 1.05rem; }
    body.aylik-modu .tab-buttons { margin-bottom: 6px; }
    body.aylik-modu .tab-btn { padding: 4px 6px; font-size: 0.8rem; }

    /* KONTROL PANELİ: TÜM SEÇİM VE FİLTRELER TEK SATIRDA
       [Varlık ▾] [HESAPLA] [SON 5 YIL] [SON 10 YIL]  BAŞ: [Ay ▾][Yıl ▾] → BİT: [Ay ▾][Yıl ▾] */
    .aylik-panel { background: #111820; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 8px; display: none; flex-direction: row; flex-wrap: nowrap; justify-content: center; align-items: center; gap: 8px 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; z-index: 40; }
    .aylik-grup { display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 6px; flex-shrink: 0; }
    .aylik-panel label { color: var(--gold); font-weight: 900; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; margin: 0; white-space: nowrap; }
    .aylik-select { background-color: #0a0e14; border: 1px solid var(--border-color); color: white; padding: 6px 5px; border-radius: 6px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 0.9rem; outline: none; cursor: pointer; transition: all 0.3s ease; color-scheme: dark; }
    .aylik-select:focus, .aylik-select:hover { border-color: var(--gold); box-shadow: 0 0 8px rgba(250, 204, 21, 0.2); }
    .aylik-select option { background-color: var(--bg-panel); color: white; }
    .aylik-ayrac { color: #475569; font-weight: 900; margin: 0 2px; }
    
    .aylik-btn { background-color: #0F766E; border: 1px solid #14B8A6; color: white; padding: 7px 12px; border-radius: 6px; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; white-space: nowrap; }
    .aylik-btn:hover { background-color: #0D9488; }
    
    /* Native SELECT (Smart TV uyumlu, aylık sekme üst panel) */
    .aylik-varlik-btn { background-color: #0a0e14; border: 2px solid var(--gold); color: white; padding: 6px 8px; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 150px; transition: 0.2s; text-align: center; appearance: auto;}
    .aylik-varlik-btn:hover { background-color: rgba(250, 204, 21, 0.1); }
    .aylik-varlik-btn option, .aylik-varlik-btn optgroup { background-color: var(--bg-panel); color: white; text-align: left; }
    
    .aylik-preset { background-color: #0a0e14; border: 1px solid var(--border-color); color: #CBD5E1; padding: 7px 10px; border-radius: 6px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .aylik-preset:hover { border-color: var(--gold); color: var(--gold); }

    /* Tek satıra sığması için etiketler kısa: BAŞ / BİT */
    .lbl-uzun { display: none; }
    .lbl-kisa { display: inline; }

    #aylikContainer { display: none; padding: 10px 12px; }
    .aylik-hint { text-align: center; padding: 30px; color: #94A3B8; font-size: 1rem; font-weight: 600; }
    .aylik-hint i { color: #14B8A6; margin-bottom: 10px; font-size: 2rem; display: block; }
    .aylik-hint.hata { color: #FACC15; }

    .aylik-ust { display: flex; justify-content: space-between; align-items: center; gap: 10px 14px; flex-wrap: wrap; max-width: 1250px; margin: 0 auto 12px auto; }
    .aylik-baslik { font-weight: 900; font-size: 1.1rem; color: var(--blue-accent); margin: 0; text-align: left; }
    .aylik-baslik span { color: #94A3B8; font-size: 0.75rem; font-weight: 700; margin-left: 8px; }
    .aylik-ozet { display: flex; gap: 8px; margin: 0; }
    .aylik-chip { background: #0a0e14; border: 1px solid var(--border-color); border-radius: 8px; padding: 4px 10px; min-width: 92px; text-align: center; }
    .aylik-chip .k { font-size: 0.58rem; color: #94A3B8; font-weight: 800; letter-spacing: 0.3px; }
    .aylik-chip .v { font-size: 0.9rem; font-weight: 900; margin-top: 1px; }
    .aylik-chip .v.poz { color: var(--green-accent); }
    .aylik-chip .v.neg { color: var(--red-accent); }
    .aylik-chip .s { font-size: 0.58rem; color: var(--gold); font-weight: 800; }

    /* Tablo: ferah (satır yüksekliği ve yazı boyutu artırılmış) */
    .mode-aylik { width: 100%; max-width: 1250px; margin: 0 auto; table-layout: fixed; }
    .mode-aylik th { font-size: 0.85rem; padding: 9px 2px; white-space: nowrap; letter-spacing: 0; }
    .mode-aylik td { padding: 11px 2px; font-size: 0.92rem; font-weight: 900; white-space: nowrap; overflow: hidden; border: 1px solid rgba(255,255,255,0.04); cursor: pointer; }
    .mode-aylik th.ay-yil, .mode-aylik td.ay-yil { width: 6%; background-color: #141b24; color: var(--gold); font-size: 0.95rem; font-weight: 900; cursor: default; }
    .mode-aylik th.ay-toplam, .mode-aylik td.ay-toplam { width: 10%; border-left: 2px solid var(--panel-border); background-color: rgba(250, 204, 21, 0.04); }
    .mode-aylik td.poz { color: var(--green-accent); }
    .mode-aylik td.neg { color: var(--red-accent); }
    .mode-aylik td.ay-bos { color: #475569; font-weight: 700; cursor: default; }
    .mode-aylik td.disi { color: #1F2937; }
    .mode-aylik td.kismi { outline: 1px dashed var(--gold); outline-offset: -3px; }
    .mode-aylik td.secili { outline: 2px solid var(--blue-accent); outline-offset: -2px; }
    .mode-aylik tr.ay-ort-satir td { border-top: 2px solid var(--panel-border); background-color: rgba(56, 189, 248, 0.05); }
    .mode-aylik tr.ay-ort-satir td.ay-yil { color: var(--blue-accent); }
    .v-kisa, .th-kisa { display: none; }
    .aylik-detay { text-align: center; color: var(--blue-accent); font-size: 0.82rem; font-weight: 800; margin: 12px 6px 4px 6px; min-height: 1.2em; }
    .aylik-not { text-align: center; color: #64748B; font-size: 0.68rem; font-weight: 600; margin: 4px 8px 12px 8px; line-height: 1.4; }

    /* Dar ekranlarda (telefon vb.) tek satıra sığmazsa alt satıra kırılmasına izin ver */
    @media (max-width: 1000px) {
      .aylik-panel { flex-wrap: wrap; }
    }

    @media (max-height: 720px) {
      .top-header { padding: 4px 10px; margin-bottom: 5px; } .header-title { font-size: 1.1rem; } .tab-buttons { margin-bottom: 5px; } .tab-btn { padding: 4px 6px; font-size: 0.8rem; }
      .mode-yillar th { font-size: 0.85rem !important; padding: 2px 4px !important; } .mode-yillar td { padding: 2px 5px !important; height: auto; }
      .getiri-val { font-size: 0.9rem; } .kat-val { font-size: 0.6rem; } .asset-select { font-size: 0.9rem !important; } .sabit-varlik { font-size: 0.9rem !important; } .table-container { box-shadow: none; }
      /* Aylık tablo sayfa kaydırmalı olduğundan sıkıştırılmaz: ferah kalır */
      .mode-aylik th { padding: 8px 2px; } .mode-aylik td { padding: 10px 2px; font-size: 0.9rem; }
    }
    @media (max-width: 768px) {
      .main-content { padding: 4px; }
      .top-header { flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; padding: 6px 8px; margin-bottom: 6px; }
      .header-title { position: static; transform: none; left: auto; font-size: 1rem; letter-spacing: 0.5px; }
      .update-badge { font-size: 0.62rem; padding: 3px 7px; gap: 4px; }
      .tab-buttons { flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
      .tab-btn { flex: 1 1 30%; margin: 0; font-size: 0.68rem; padding: 5px 3px; gap: 4px; line-height: 1.1; text-align: center; }
      body.aylik-modu .tab-btn { padding: 4px 3px; font-size: 0.66rem; }
      .date-controls { justify-content: space-between; padding: 10px; gap: 10px; } .date-group { flex-direction: column; width: 48%; gap: 6px; }
      .date-controls label { width: 100%; justify-content: center; font-size: 0.75rem; } .date-input { width: 100% !important; padding: 8px 5px !important; font-size: 0.9rem !important; }
      .mode-yillar { width: max-content; margin: 0 auto; } .mode-yillar th, .mode-yillar td { padding: 6px 8px; } .col-varlik { padding-left: 10px !important; }
      .mode-tarih { max-width: 100% !important; margin: 0 auto !important; } .mode-tarih th { font-size: 0.95rem !important; padding: 4px 2px !important; } .mode-tarih td { font-size: 0.95rem !important; padding: 1px 2px !important; }
      .mode-tarih th:nth-child(2), .mode-tarih td:nth-child(2) { padding-left: 10px !important; } .mode-tarih th:nth-child(3), .mode-tarih td:nth-child(3) { padding-left: 2px !important; }
      .asset-select { font-size: 0.95rem !important; padding: 4px;} .sabit-varlik { font-size: 0.95rem !important; }

      /* Aylık getiri: mobil (dar ekranda satırlara kırılır) */
      .aylik-panel { padding: 6px; gap: 5px; margin-bottom: 5px; }
      .aylik-grup { gap: 4px; width: 100%; }
      .aylik-varlik-btn { flex: 1; width: auto; min-width: 0; font-size: 0.95rem; padding: 8px 8px; }
      .aylik-panel label { font-size: 0.7rem; gap: 3px; }
      .aylik-select { padding: 5px 2px; font-size: 0.74rem; }
      .aylik-ayrac { margin: 0; font-size: 0.7rem; }
      .aylik-preset { padding: 7px 8px; font-size: 0.68rem; }
      .aylik-btn { padding: 7px 8px; font-size: 0.74rem; }
      #aylikContainer { padding: 5px 3px; }
      .aylik-ust { flex-direction: column; gap: 4px; margin-bottom: 5px; }
      .aylik-baslik { text-align: center; font-size: 0.95rem; }
      .aylik-baslik span { font-size: 0.62rem; margin-left: 5px; }
      .aylik-ozet { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; width: 100%; }
      .aylik-chip { min-width: 0; padding: 3px 1px; border-radius: 6px; }
      .aylik-chip .k { font-size: 0.48rem; letter-spacing: 0; }
      .aylik-chip .v { font-size: 0.68rem; }
      .aylik-chip .s { font-size: 0.5rem; }
      .mode-aylik th { font-size: 0.5rem; padding: 4px 0; }
      .mode-aylik td { font-size: 0.62rem; padding: 6px 0; }
      .mode-aylik th.ay-yil, .mode-aylik td.ay-yil { width: 9%; font-size: 0.6rem; }
      .mode-aylik th.ay-toplam, .mode-aylik td.ay-toplam { width: 13%; border-left-width: 1px; }
      .v-uzun, .th-uzun { display: none; }
      .v-kisa, .th-kisa { display: inline; }
      .aylik-detay { font-size: 0.68rem; margin: 6px 2px 2px 2px; }
      .aylik-not { display: none; }
    }
  </style>
</head>
<body>

  <main class="main-content">
    <div class="top-header">
      <h1 class="header-title">GETİRİ TAKİBİ</h1>
      <div class="update-badge">
        <div class="dot"></div> SON VERİ: <span style="color: #94A3B8; margin-left: 5px;" id="lastUpdateText">Yükleniyor...</span>
        <span style="color: #475569; margin: 0 8px;">|</span>
        <span style="color: #10B981;" id="assetCountText"><i class="fa-solid fa-spinner fa-spin"></i></span>
      </div>
    </div>

    <div class="tab-buttons">
      <button id="btnYillar" class="tab-btn active" onclick="sekmeDegistir('yillar')">
        <i class="fa-solid fa-chart-column"></i> YILLARA GÖRE
      </button>
      <button id="btnTarih" class="tab-btn inactive" onclick="sekmeDegistir('tarih')">
        <i class="fa-solid fa-hourglass-end"></i> İKİ TARİH ARASI
      </button>
      <button id="btnTop10" class="tab-btn inactive" onclick="sekmeDegistir('top10')" style="background-color: #4C1D95; border-color: #6D28D9;">
        <i class="fa-solid fa-trophy"></i> EN İYİ 10
      </button>
      <button id="btnBottom10" class="tab-btn inactive" onclick="sekmeDegistir('bottom10')" style="background-color: #7F1D1D; border-color: #991B1B;">
        <i class="fa-solid fa-arrow-trend-down"></i> EN KÖTÜ 10
      </button>
      <button id="btnAylik" class="tab-btn inactive" onclick="sekmeDegistir('aylik')" style="background-color: #115E59; border-color: #14B8A6;">
        <i class="fa-solid fa-calendar-days"></i> AYLIK GETİRİ
      </button>
    </div>

    <div id="datePanel" class="date-controls">
      <div class="date-group">
        <label><i class="fa-solid fa-calendar-day"></i> BAŞLANGIÇ:</label>
        <input type="text" id="tarihBaslangic" class="date-input" placeholder="Tarih Seç">
      </div>
      <div class="date-group">
        <label><i class="fa-solid fa-calendar-check"></i> BİTİŞ:</label>
        <input type="text" id="tarihBitis" class="date-input" placeholder="Tarih Seç">
      </div>
    </div>

    <!-- TEK SATIR: varlık + HESAPLA + SON 5 YIL + SON 10 YIL + BAŞ ay/yıl → BİT ay/yıl -->
    <div id="aylikPanel" class="aylik-panel">
      <div class="aylik-grup g-varlik">
        <select id="aylikVarlikSelect" class="aylik-varlik-btn" onchange="aylikVarlikSecildi(this)">
          <option value="" disabled selected>VARLIK SEÇ</option>
        </select>
        <button type="button" id="aylikGetirBtn" class="aylik-btn" onclick="aylikSorguBaslat()">
          <i class="fa-solid fa-calculator"></i> HESAPLA
        </button>
      </div>
      <div class="aylik-grup g-preset">
        <button type="button" class="aylik-preset" onclick="aylikOnAyar(5, true)">SON 5 YIL</button>
        <button type="button" class="aylik-preset" onclick="aylikOnAyar(10, true)">SON 10 YIL</button>
      </div>
      <div class="aylik-grup g-donem">
        <label><i class="fa-solid fa-calendar-day"></i><span class="lbl-uzun">BAŞLANGIÇ:</span><span class="lbl-kisa">BAŞ:</span></label>
        <select id="aylikBasAy" class="aylik-select"></select>
        <select id="aylikBasYil" class="aylik-select"></select>
        <span class="aylik-ayrac">→</span>
        <label><i class="fa-solid fa-calendar-check"></i><span class="lbl-uzun">BİTİŞ:</span><span class="lbl-kisa">BİT:</span></label>
        <select id="aylikBitAy" class="aylik-select"></select>
        <select id="aylikBitYil" class="aylik-select"></select>
      </div>
    </div>

    <div id="tableContainer" class="table-container">
      <table id="dataTable" class="mode-yillar">
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="15" class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i><br>Sistem Verileri Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="aylikContainer" class="table-container">
      <div class="aylik-hint"><i class="fa-solid fa-calendar-days"></i>Yukarıdaki "VARLIK SEÇ" listesinden bir hisse ya da varlık seçin. Dönemi dilediğiniz gibi ayarlayabilirsiniz (en fazla 10 takvim yılı); varsayılan son 10 yıldır.</div>
    </div>
  </main>

  <div id="toastNotification" class="toast">
    <i class="fa-solid fa-circle-info" style="color: #38BDF8; font-size: 1.2rem;"></i>
    <span id="toastMessage">Bildirim mesajı</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/tr.js"></script>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxvISjns0Zle5VYIgTLzkoJa38T7LC20bRAEW9Sm6LZYpcW61PF1pzrcgBAulDV6XNM/exec";

    let globalAssets = [];
    let globalYillar = [];
    let aktifSekme = 'yillar';
    let fpBaslangic, fpBitis;
    
    let sekmeTarihleri = {
      tarih: { bas: "", bitis: "" },
      top10: { bas: "", bitis: "" },
      bottom10: { bas: "", bitis: "" }
    };

    let cacheVeriler = { tarih: null, top10: null, bottom10: null };

    // AYLIK GETİRİ SEKMESİ DURUMU
    let cacheAylik = {};
    let aylikIstekNo = 0;
    let aylikSonVeri = { y: new Date().getFullYear(), m: new Date().getMonth() + 1 };
    const AY_ADLARI = ["OCA", "ŞUB", "MAR", "NİS", "MAY", "HAZ", "TEM", "AĞU", "EYL", "EKİ", "KAS", "ARA"];
    const AY_ADLARI_KISA = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
    const AYLIK_EN_ESKI_YIL = 1995;
    const AYLIK_MAKS_YIL_SAYISI = 10;
    let aylikSeciliVarlik = ""; 

    const SABIT_VARLIKLAR = ["DOLAR", "EURO", "GR ALTIN", "GR GÜMÜŞ", "NASDAQ", "S&P 500"];

    async function apiRequest(payload) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (error) {
        console.error("API Hatası:", error);
        throw error;
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      aylikSecicileriHazirla();
      aylikOnAyar(10, false);
      veriCekHizliAcilis();

      fpBaslangic = flatpickr("#tarihBaslangic", {
        locale: "tr", dateFormat: "Y-m-d", altInput: true, altFormat: "d.m.Y", disableMobile: "true",
        onChange: function(selectedDates, dateStr, instance) {
          if (aktifSekme !== 'yillar' && aktifSekme !== 'aylik') {
            sekmeTarihleri[aktifSekme].bas = dateStr;
            cacheVeriler[aktifSekme] = null; 
            googleSorgusuTetikle(); 
          }
          if (instance && instance.altInput) instance.altInput.blur();
          if (instance && instance.element) instance.element.blur();
        }
      });

      fpBitis = flatpickr("#tarihBitis", {
        locale: "tr", dateFormat: "Y-m-d", altInput: true, altFormat: "d.m.Y", disableMobile: "true",
        onChange: function(selectedDates, dateStr, instance) {
          if (aktifSekme !== 'yillar' && aktifSekme !== 'aylik') {
            sekmeTarihleri[aktifSekme].bitis = dateStr;
            cacheVeriler[aktifSekme] = null; 
            googleSorgusuTetikle(); 
          }
          if (instance && instance.altInput) instance.altInput.blur();
          if (instance && instance.element) instance.element.blur();
        }
      });

      ['aylikBasAy', 'aylikBasYil', 'aylikBitAy', 'aylikBitYil'].forEach(function(id) {
        document.getElementById(id).addEventListener('change', aylikDegisti);
      });

      document.getElementById('aylikContainer').addEventListener('click', function(e) {
        const td = (e.target && e.target.closest) ? e.target.closest('td') : null;
        if (!td || !td.dataset || !td.dataset.bilgi) return;
        const detay = document.getElementById('aylikDetay');
        if (!detay) return;
        detay.textContent = td.dataset.bilgi;
        const onceki = document.querySelector('#aylikTable td.secili');
        if (onceki) onceki.classList.remove('secili');
        td.classList.add('secili');
      });
    });

    function gosterToast(mesaj, renk = "#10B981") {
      const toast = document.getElementById('toastNotification');
      const msgEl = document.getElementById('toastMessage');
      toast.style.borderLeftColor = renk;
      msgEl.innerText = mesaj;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function varlikSelectleriDoldur() {
      const selAylik = document.getElementById('aylikVarlikSelect');
      if (!selAylik || globalAssets.length === 0) return;
      
      const sabitler = SABIT_VARLIKLAR.filter(a => globalAssets.includes(a));
      const hisseler = globalAssets.filter(a => !SABIT_VARLIKLAR.includes(a));
      
      // Aylık Select Opsiyonlarını oluşturma
      let html = '<option value="" disabled selected>VARLIK SEÇ</option>';
      if (sabitler.length > 0) {
          html += '<optgroup label="HIZLI SEÇİM">';
          sabitler.forEach(a => { html += `<option value="${a}">${a}</option>`; });
          html += '</optgroup>';
      }
      if (hisseler.length > 0) {
          html += '<optgroup label="HİSSELER">';
          hisseler.forEach(a => { html += `<option value="${a}">${a}</option>`; });
          html += '</optgroup>';
      }
      selAylik.innerHTML = html;
    }

    // Native Select seçildiğinde çalışır
    function aylikVarlikSecildi(selectEl) {
        if(!selectEl.value) return;
        aylikSeciliVarlik = selectEl.value;
        aylikSorguBaslat();
    }

    function veriCekHizliAcilis() {
      apiRequest({ action: 'getAppData' })
        .then(response => {
          if(!response || response.hata) { bosTabloGoster("Sunucu Hatası"); return; }
          
          globalYillar = response.yillar;
          globalAssets = response.assets;
          varlikSelectleriDoldur();
          
          document.getElementById('lastUpdateText').innerText = response.lastUpdate;
          document.getElementById('assetCountText').innerText = (response.assets.length > 0) ? response.assets.length + " VARLIK" : "Yüklendi";

          aylikSonVeriAyarla(response.lastUpdate);
          aylikOnAyar(10, false);
          
          if (aktifSekme === 'yillar') {
             tabloyuCiz(globalYillar);
          }
          gosterToast("Sistem hazır!", "#38BDF8");
        })
        .catch(err => bosTabloGoster("BAĞLANTI HATASI"));
    }

    function googleSorgusuTetikle() {
      let islemSekmesi = aktifSekme;
      let bas = sekmeTarihleri[islemSekmesi].bas;
      let bitis = sekmeTarihleri[islemSekmesi].bitis;
      
      if (!bas || !bitis) return;
      
      if (cacheVeriler[islemSekmesi]) {
         if (aktifSekme === islemSekmesi) { tabloyuCiz(cacheVeriler[islemSekmesi]); }
         return;
      }

      bosTabloGoster("Veritabanından Hesaplanıyor...", true);

      let islem = 'tarihVerileriniGetir';
      if (islemSekmesi === 'top10') islem = 'enIyi10';
      if (islemSekmesi === 'bottom10') islem = 'enKotu10';

      apiRequest({ action: islem, bas: bas, bitis: bitis })
        .then(res => {
           if(res.hata) { 
               if (aktifSekme === islemSekmesi) bosTabloGoster(res.hata); 
               return; 
           }
           cacheVeriler[islemSekmesi] = res.satirlar; 
           
           if (aktifSekme === islemSekmesi) {
               tabloyuCiz(res.satirlar);
               gosterToast("Hesaplandı: " + res.basKullanilan + " → " + res.bitKullanilan, "#10B981");
           }
        })
        .catch(err => {
            if (aktifSekme === islemSekmesi) bosTabloGoster("Hata oluştu.");
        });
    }

    function varlikDegistir(tr, dataIndex, yeniVarlik) {
      tr.classList.add('row-loading');
      let bas = (aktifSekme === 'yillar') ? "" : sekmeTarihleri[aktifSekme].bas;
      let bit = (aktifSekme === 'yillar') ? "" : sekmeTarihleri[aktifSekme].bitis;

      apiRequest({ action: 'varlikGuncelle', sekme: aktifSekme, dataIndex: dataIndex, yeniVarlik: yeniVarlik, bas: bas, bitis: bit })
      .then(res => {
          tr.classList.remove('row-loading');
          if(aktifSekme === 'yillar') {
              if(res.yillar) { globalYillar = res.yillar; }
              tabloyuCiz(globalYillar);
              gosterToast("Hisse değiştirildi!", "#10B981");
          } else if (aktifSekme === 'tarih') {
              cacheVeriler['tarih'] = null; 
              googleSorgusuTetikle();
          }
      }).catch(err => {
          gosterToast("Kayıt Hatası", "#EF4444");
          tr.classList.remove('row-loading');
      });
    }

    function tabloyuCiz(data) {
      if(!data || data.length === 0) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="15" style="padding: 20px; color: #EF4444; text-align:center;">Veri bulunamadı.</td></tr>';
        return;
      }

      const headers = data[0].slice(0, 11);
      const headerRow = document.getElementById('tableHeader');
      headerRow.innerHTML = '';

      headers.forEach((baslik, index) => {
        let th = document.createElement('th');
        if(index === 0 && !baslik) baslik = "SIRA";
        if(index === 1 && !baslik) baslik = "VARLIK";
        if(index === 2 && !baslik && (aktifSekme === 'tarih' || aktifSekme === 'top10' || aktifSekme === 'bottom10')) baslik = "GETİRİ";

        th.innerText = baslik;
        if(index === 0) th.className = 'col-sira';
        if(index === 1) th.className = 'col-varlik';
        headerRow.appendChild(th);
      });

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      for (let i = 1; i < data.length; i++) {
        let rowData = data[i];
        let visibleRowData = rowData.slice(0, 11);

        if (visibleRowData[0] === "📌") {
          let spacerTr = document.createElement('tr');
          spacerTr.style.pointerEvents = "none";
          let spacerTd = document.createElement('td');
          spacerTd.colSpan = visibleRowData.length;
          spacerTd.style.height = "10px";
          spacerTd.style.border = "none";
          spacerTd.style.padding = "0";
          spacerTd.style.backgroundColor = "transparent";
          spacerTr.appendChild(spacerTd);
          tbody.appendChild(spacerTr);
        }

        let tr = document.createElement('tr');

        visibleRowData.forEach((hucreVerisi, index) => {
          let td = document.createElement('td');

          if (index === 0) {
            td.className = 'col-sira';
            td.innerText = (hucreVerisi === "📌" || visibleRowData[0] === "📌") ? "📌" : i;
          } else if (index === 1) {
            td.className = 'col-varlik';
            if (aktifSekme === 'top10' || aktifSekme === 'bottom10' || visibleRowData[0] === "📌") {
              td.innerText = hucreVerisi;
              td.style.color = (hucreVerisi === "GR ALTIN" && visibleRowData[0] === "📌") ? "#FBBF24" : "#38BDF8";
              td.style.fontWeight = "900";
              td.classList.add("sabit-varlik");
            } else {
              // TV Dostu Hücre İçi Native Select Tasarımı
              let wrapper = document.createElement('div');
              wrapper.className = 'select-wrapper';

              let sel = document.createElement('select');
              sel.className = 'asset-select';
              
              const sabitler = SABIT_VARLIKLAR.filter(a => globalAssets.includes(a));
              const hisseler = globalAssets.filter(a => !SABIT_VARLIKLAR.includes(a));

              if(sabitler.length > 0) {
                  let og = document.createElement('optgroup');
                  og.label = "HIZLI SEÇİM";
                  sabitler.forEach(a => { let o = document.createElement('option'); o.value = a; o.textContent = a; og.appendChild(o); });
                  sel.appendChild(og);
              }
              if(hisseler.length > 0) {
                  let og = document.createElement('optgroup');
                  og.label = "HİSSELER";
                  hisseler.forEach(a => { let o = document.createElement('option'); o.value = a; o.textContent = a; og.appendChild(o); });
                  sel.appendChild(og);
              }
              
              sel.value = hucreVerisi;
              
              sel.onchange = function(e) {
                  let yeniVarlik = e.target.value;
                  if(yeniVarlik === hucreVerisi) return;
                  varlikDegistir(tr, i, yeniVarlik);
              };

              wrapper.appendChild(sel);
              td.appendChild(wrapper);
            }

          } else {
            if(hucreVerisi === "" || hucreVerisi === "-" || hucreVerisi === null) {
              td.innerText = "-";
              td.style.color = "#475569";
            } else {
              let textVal = hucreVerisi.toString();
              let parts = textVal.split("\n");
              let safGetiri = parts[0].trim().replace(/%/g, '');

              if (safGetiri.startsWith('-')) {
                  parts[0] = '%-' + safGetiri.substring(1);
              } else {
                  parts[0] = '%' + safGetiri;
              }

              let isNegative = parts[0].includes("-");
              td.className = isNegative ? 'col-getiri negative' : 'col-getiri';

              let katHtml = "";
              if (!isNegative && aktifSekme === 'yillar') {
                  let sayisalGetiri = parseFloat(safGetiri.replace(/\./g, "").replace(",", "."));
                  if (!isNaN(sayisalGetiri) && sayisalGetiri >= 100) {
                      let katSayisi = (sayisalGetiri / 100) + 1;
                      let formatliKat = (katSayisi % 1 === 0) ? katSayisi : katSayisi.toFixed(1);
                      formatliKat = formatliKat.toString().replace(".", ",");
                      katHtml = `<span class="kat-val">(${formatliKat} KAT)</span>`;
                  }
              }

              let ustSatir = `<span class="getiri-val">${parts[0]}</span>`;
              if (parts.length > 1) {
                  ustSatir += `<span class="arz-val">${parts[1]}</span>`;
              }

              td.innerHTML = `
                <div class="getiri-wrapper">
                  <div style="position:relative; display:inline-flex; align-items:center;">
                    ${ustSatir}
                  </div>
                  ${katHtml}
                </div>`;
            }
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
    }

    function bosTabloGoster(mesaj, yukleniyorMu = false) {
      document.getElementById('tableHeader').innerHTML = '<th class="col-sira">SIRA</th><th class="col-varlik">VARLIK</th><th>GETİRİ</th>';
      if (yukleniyorMu) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="3" class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i><br>' + mesaj + '</td></tr>';
      } else {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="3" style="padding: 20px; color: #FACC15; text-align:center;">' + mesaj + '</td></tr>';
      }
    }

    function htmlKacis(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function ikiHane(n) {
      return (n < 10 ? "0" : "") + n;
    }

    function aylikSecicileriHazirla() {
      const buYil = new Date().getFullYear();

      ['aylikBasAy', 'aylikBitAy'].forEach(function(id) {
        const sel = document.getElementById(id);
        sel.innerHTML = '';
        AY_ADLARI_KISA.forEach(function(ad, i) {
          const opt = document.createElement('option');
          opt.value = String(i + 1);
          opt.textContent = ad;
          sel.appendChild(opt);
        });
      });

      ['aylikBasYil', 'aylikBitYil'].forEach(function(id) {
        const sel = document.getElementById(id);
        sel.innerHTML = '';
        for (let y = buYil; y >= AYLIK_EN_ESKI_YIL; y--) {
          const opt = document.createElement('option');
          opt.value = String(y);
          opt.textContent = String(y);
          sel.appendChild(opt);
        }
      });
    }

    function aylikSonVeriAyarla(metin) {
      const p = String(metin || "").match(/(\d{2})\.(\d{2})\.(\d{4})/);
      if (p) aylikSonVeri = { y: parseInt(p[3], 10), m: parseInt(p[2], 10) };
    }

    function aylikSeciciYaz(basIdx, bitIdx) {
      const basY = Math.max(AYLIK_EN_ESKI_YIL, Math.floor(basIdx / 12));
      document.getElementById('aylikBasYil').value = String(basY);
      document.getElementById('aylikBasAy').value = String((basIdx % 12) + 1);
      document.getElementById('aylikBitYil').value = String(Math.floor(bitIdx / 12));
      document.getElementById('aylikBitAy').value = String((bitIdx % 12) + 1);
    }

    function aylikOnAyar(yil, tetikle) {
      const bitIdx = aylikSonVeri.y * 12 + (aylikSonVeri.m - 1);
      const basIdx = (aylikSonVeri.y - (yil - 1)) * 12;
      aylikSeciciYaz(basIdx, bitIdx);
      if (tetikle) aylikDegisti();
    }

    function aylikDonemiDuzelt(degisenId) {
      const basY = parseInt(document.getElementById('aylikBasYil').value, 10);
      const basA = parseInt(document.getElementById('aylikBasAy').value, 10);
      const bitY = parseInt(document.getElementById('aylikBitYil').value, 10);
      const bitA = parseInt(document.getElementById('aylikBitAy').value, 10);
      if (isNaN(basY) || isNaN(basA) || isNaN(bitY) || isNaN(bitA)) return;

      let basIdx = basY * 12 + (basA - 1);
      let bitIdx = bitY * 12 + (bitA - 1);
      const sonIdx = aylikSonVeri.y * 12 + (aylikSonVeri.m - 1);
      const basDegisti = (degisenId === 'aylikBasAy' || degisenId === 'aylikBasYil');
      let mesaj = "";

      if (bitIdx > sonIdx) {
        bitIdx = sonIdx;
        mesaj = "Bitiş ayı, son veri ayını geçemez.";
      }

      if (basIdx > bitIdx) {
        if (basDegisti) { bitIdx = basIdx; } else { basIdx = bitIdx; }
        if (bitIdx > sonIdx) { bitIdx = sonIdx; basIdx = Math.min(basIdx, sonIdx); }
      }

      if (Math.floor(bitIdx / 12) - Math.floor(basIdx / 12) > (AYLIK_MAKS_YIL_SAYISI - 1)) {
        if (basDegisti) {
          bitIdx = (Math.floor(basIdx / 12) + (AYLIK_MAKS_YIL_SAYISI - 1)) * 12 + (bitIdx % 12);
          if (bitIdx > sonIdx) bitIdx = sonIdx;
        } else {
          basIdx = (Math.floor(bitIdx / 12) - (AYLIK_MAKS_YIL_SAYISI - 1)) * 12 + (basIdx % 12);
        }
        mesaj = "En fazla " + AYLIK_MAKS_YIL_SAYISI + " takvim yılı seçilebilir.";
      }

      aylikSeciciYaz(basIdx, bitIdx);
      if (mesaj) gosterToast(mesaj, "#FACC15");
    }

    function aylikDegisti(e) {
      aylikDonemiDuzelt(e && e.target ? e.target.id : '');
      if (!aylikSeciliVarlik || !globalAssets || globalAssets.length === 0) return;
      aylikSorguBaslat();
    }

    function fmtGetiri(g) {
      return (g < 0) ? "%-" + Math.abs(g).toFixed(2).replace(".", ",") : "%" + g.toFixed(2).replace(".", ",");
    }

    function fmtKisa(g) {
      const mutlak = Math.abs(g);
      const metin = (mutlak < 10) ? mutlak.toFixed(1).replace(".", ",") : String(Math.round(mutlak));
      return (g < 0 ? "-" : "") + metin;
    }

    function fmtFiyat(v) {
      return Number(v).toFixed(3).replace(".", ",");
    }

    function aylikMesajGoster(mesaj, yukleniyorMu = false, hataMi = false) {
      const c = document.getElementById('aylikContainer');
      c.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'aylik-hint' + (hataMi ? ' hata' : '');
      const i = document.createElement('i');
      i.className = yukleniyorMu ? 'fa-solid fa-spinner fa-spin' : (hataMi ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-calendar-days');
      if (hataMi) i.style.color = '#FACC15';
      d.appendChild(i);
      d.appendChild(document.createTextNode(mesaj));
      c.appendChild(d);
    }

    function aylikSorguBaslat() {
      if (!aylikSeciliVarlik) { aylikMesajGoster("Lütfen önce listeden bir varlık seçin.", false, true); return; }
      if (!globalAssets || globalAssets.length === 0) { aylikMesajGoster("Varlık listesi henüz yüklenmedi, birkaç saniye sonra tekrar deneyin.", false, true); return; }

      const eslesen = aylikSeciliVarlik;
      aylikDonemiDuzelt('');

      const basY = parseInt(document.getElementById('aylikBasYil').value, 10);
      const basA = parseInt(document.getElementById('aylikBasAy').value, 10);
      const bitY = parseInt(document.getElementById('aylikBitYil').value, 10);
      const bitA = parseInt(document.getElementById('aylikBitAy').value, 10);

      if (isNaN(basY) || isNaN(basA) || isNaN(bitY) || isNaN(bitA)) { aylikMesajGoster("Lütfen başlangıç ve bitiş ayını seçin.", false, true); return; }
      if ((basY * 12 + basA) > (bitY * 12 + bitA)) { aylikMesajGoster("Başlangıç ayı, bitiş ayından sonra olamaz.", false, true); return; }

      const basStr = basY + "-" + ikiHane(basA);
      const bitStr = bitY + "-" + ikiHane(bitA);
      const anahtar = eslesen + "|" + basStr + "|" + bitStr;

      if (cacheAylik[anahtar]) { aylikCiz(cacheAylik[anahtar]); return; }

      const istekNo = ++aylikIstekNo;
      aylikMesajGoster("Aylık getiriler hesaplanıyor...", true);

      apiRequest({ action: 'aylikGetiri', varlik: eslesen, basAy: basStr, bitAy: bitStr })
        .then(res => {
          if (istekNo !== aylikIstekNo) return; 
          if (!res || res.hata) { aylikMesajGoster((res && res.hata) ? res.hata : "Hata oluştu.", false, true); return; }
          cacheAylik[anahtar] = res;
          aylikCiz(res);
        })
        .catch(err => {
          if (istekNo !== aylikIstekNo) return;
          aylikMesajGoster("BAĞLANTI HATASI", false, true);
        });
    }

    function aylikRenkArkaPlani(g) {
      const alfa = (0.05 + Math.min(Math.abs(g) / 30, 1) * 0.30).toFixed(3);
      return (g >= 0) ? 'rgba(16,185,129,' + alfa + ')' : 'rgba(239,68,68,' + alfa + ')';
    }

    function aylikHucre(a, yil, mIdx) {
      if (!a || a.durum === 'disi') return '<td class="ay-bos disi">·</td>';
      if (a.durum !== 'ok') return '<td class="ay-bos">-</td>';

      const poz = a.getiri >= 0;
      let basMetin = a.bas;
      if (a.arz) basMetin += ' (ARZ)';
      else if (a.basFiyatTarih && a.basFiyatTarih !== a.bas) basMetin += ' [' + a.basFiyatTarih + ' kapanışı]';

      let bitMetin = a.bit;
      if (a.bitFiyatTarih && a.bitFiyatTarih !== a.bit) bitMetin += ' [' + a.bitFiyatTarih + ' kapanışı]';

      const bilgi = AY_ADLARI[mIdx] + ' ' + yil + '  •  ' + basMetin + ' (' + fmtFiyat(a.basFiyat) + ') → ' + bitMetin + ' (' + fmtFiyat(a.bitFiyat) + ')  •  ' + fmtGetiri(a.getiri) + (a.kismi ? '  •  AY HENÜZ TAMAMLANMADI' : '');
      return '<td class="' + (poz ? 'poz' : 'neg') + (a.kismi ? ' kismi' : '') + '" style="background-color:' + aylikRenkArkaPlani(a.getiri) + ';" data-bilgi="' + htmlKacis(bilgi) + '" title="' + htmlKacis(bilgi) + '">' +
             '<span class="v-uzun">' + fmtGetiri(a.getiri) + '</span><span class="v-kisa">' + fmtKisa(a.getiri) + '</span></td>';
    }

    function aylikToplamHucre(g, yil) {
      if (g === null || g === undefined) return '<td class="ay-toplam ay-bos">-</td>';
      const bilgi = yil + ' yıllık (aylık getirilerin bileşiği)  •  ' + fmtGetiri(g);
      return '<td class="ay-toplam ' + (g >= 0 ? 'poz' : 'neg') + '" data-bilgi="' + htmlKacis(bilgi) + '" title="' + htmlKacis(bilgi) + '">' +
             '<span class="v-uzun">' + fmtGetiri(g) + '</span><span class="v-kisa">' + fmtKisa(g) + '</span></td>';
    }

    function aylikOrtHucre(g, mIdx) {
      if (g === null || g === undefined) return '<td class="ay-bos">-</td>';
      const bilgi = AY_ADLARI[mIdx] + ' ayı ortalaması (seçilen dönemdeki tüm yıllar)  •  ' + fmtGetiri(g);
      return '<td class="' + (g >= 0 ? 'poz' : 'neg') + '" data-bilgi="' + htmlKacis(bilgi) + '" title="' + htmlKacis(bilgi) + '">' +
             '<span class="v-uzun">' + fmtGetiri(g) + '</span><span class="v-kisa">' + fmtKisa(g) + '</span></td>';
    }

    function aylikCiz(res) {
      const c = document.getElementById('aylikContainer');
      const oz = res.ozet;

      let html = '<div class="aylik-ust">';
      html += '<div class="aylik-baslik">' + htmlKacis(res.hisse) + '<span>' + htmlKacis(res.baslangicAy) + ' – ' + htmlKacis(res.bitisAy) + ' • ' + res.ayAdedi + ' AY</span></div>';

      if (oz && oz.adet > 0) {
        const yuzde = Math.round((oz.pozitif / oz.adet) * 100);
        html += '<div class="aylik-ozet">';
        html += '<div class="aylik-chip"><div class="k">AY SAYISI</div><div class="v">' + oz.adet + '</div></div>';
        html += '<div class="aylik-chip"><div class="k">POZ. / NEG.</div><div class="v"><span style="color:var(--green-accent)">' + oz.pozitif + '</span>/<span style="color:var(--red-accent)">' + oz.negatif + '</span></div><div class="s">%' + yuzde + ' POZİTİF</div></div>';
        html += '<div class="aylik-chip"><div class="k">ORT. AYLIK</div><div class="v ' + (oz.ortalama >= 0 ? 'poz' : 'neg') + '">' + fmtGetiri(oz.ortalama) + '</div></div>';
        html += '<div class="aylik-chip"><div class="k">EN İYİ AY</div><div class="v poz">' + fmtGetiri(oz.enIyi.getiri) + '</div><div class="s">' + htmlKacis(oz.enIyi.ay) + '</div></div>';
        html += '<div class="aylik-chip"><div class="k">EN KÖTÜ AY</div><div class="v ' + (oz.enKotu.getiri >= 0 ? 'poz' : 'neg') + '">' + fmtGetiri(oz.enKotu.getiri) + '</div><div class="s">' + htmlKacis(oz.enKotu.ay) + '</div></div>';
        html += '</div>';
      }
      html += '</div>';

      html += '<table id="aylikTable" class="mode-aylik"><thead><tr><th class="ay-yil">YIL</th>';
      AY_ADLARI.forEach(a => { html += '<th>' + a + '</th>'; });
      html += '<th class="ay-toplam"><span class="th-uzun">YIL (BİLEŞİK)</span><span class="th-kisa">YILLIK</span></th></tr></thead><tbody>';

      (res.satirlar || []).forEach(s => {
        html += '<tr><td class="ay-yil">' + s.yil + '</td>';
        s.aylar.forEach((a, mIdx) => { html += aylikHucre(a, s.yil, mIdx); });
        html += aylikToplamHucre(s.yillik, s.yil);
        html += '</tr>';
      });

      html += '<tr class="ay-ort-satir"><td class="ay-yil">ORT.</td>';
      (res.ortalamalar || []).forEach((g, mIdx) => { html += aylikOrtHucre(g, mIdx); });
      html += '<td class="ay-toplam ay-bos">-</td></tr>';
      html += '</tbody></table>';

      html += '<div id="aylikDetay" class="aylik-detay">Bir hücreye tıklayın veya dokunun: kullanılan tarihler ve fiyatlar burada görünür.</div>';
      html += '<div class="aylik-not">Her ayın getirisi daima takvim ayına göre gösterilir. Fiyatlar uygulamanın kendi veritabanından okunur.</div>';

      c.innerHTML = html;
    }

    function sekmeDegistir(hedef) {
      if(aktifSekme === hedef) return;
      aktifSekme = hedef;

      window.scrollTo(0, 0);
      document.body.classList.toggle('aylik-modu', hedef === 'aylik');

      document.getElementById('btnYillar').className = (hedef === 'yillar') ? 'tab-btn active' : 'tab-btn inactive';
      document.getElementById('btnTarih').className = (hedef === 'tarih') ? 'tab-btn active' : 'tab-btn inactive';
      document.getElementById('btnTop10').className = (hedef === 'top10') ? 'tab-btn active' : 'tab-btn inactive';
      document.getElementById('btnBottom10').className = (hedef === 'bottom10') ? 'tab-btn active' : 'tab-btn inactive';
      document.getElementById('btnAylik').className = (hedef === 'aylik') ? 'tab-btn active' : 'tab-btn inactive';

      document.getElementById('btnTop10').style.backgroundColor = (hedef === 'top10') ? "#7C3AED" : "#4C1D95";
      document.getElementById('btnBottom10').style.backgroundColor = (hedef === 'bottom10') ? "#B91C1C" : "#7F1D1D";
      document.getElementById('btnAylik').style.backgroundColor = (hedef === 'aylik') ? "#0D9488" : "#115E59";

      const datePanel = document.getElementById('datePanel');
      const aylikPanel = document.getElementById('aylikPanel');
      const dataTable = document.getElementById('dataTable');
      const tableContainer = document.getElementById('tableContainer');
      const aylikContainer = document.getElementById('aylikContainer');

      if (hedef === 'aylik') {
        datePanel.style.display = 'none';
        tableContainer.style.display = 'none';
        aylikPanel.style.display = 'flex';
        aylikContainer.style.display = 'block';
        return;
      }

      aylikPanel.style.display = 'none';
      aylikContainer.style.display = 'none';
      tableContainer.style.display = 'block';

      if (hedef === 'yillar') {
        datePanel.style.display = 'none';
        dataTable.className = 'mode-yillar';
        tabloyuCiz(globalYillar);
      } else {
        datePanel.style.display = 'flex';
        dataTable.className = 'mode-tarih';
        
        fpBaslangic.setDate(sekmeTarihleri[hedef].bas, false);
        fpBitis.setDate(sekmeTarihleri[hedef].bitis, false);
        
        let bas = sekmeTarihleri[hedef].bas;
        let bitis = sekmeTarihleri[hedef].bitis;

        if(!bas || !bitis) {
            bosTabloGoster("Lütfen başlangıç ve bitiş tarihi seçin.");
        } else {
            googleSorgusuTetikle();
        }
      }
    }
  </script>
